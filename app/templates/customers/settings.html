{% extends 'customers/base.html' %} {% block head %} {% endblock %} 
{% block content %}

<!-- Settings Content -->
<form
  action="/customers/settings/?id={{ request.user.id }}"
  method="POST"
  enctype="multipart/form-data"
>
  {% csrf_token %}
  <div
    class="w-[80%] mx-auto my-10 shadow-sm p-5 bg-white my-3.5 border border-gray-100 rounded-md"
  >
    <div class="flex items-center justify-between mb-5">
      <div class="block px-4 py-2">
        <h2 class="text-xl font-medium text-black/70">Account Information</h2>
        <p class="text-sm text-black/50 font-medium">
          update your personal information and account details.
        </p>
      </div>

      
    </div>

    <div class="my-10 mx-4 flex items-center">
      <div class="relative">
        <img
          src="https://api.dicebear.com/10.x/initials/svg?seed={{ request.user.name }}"
          class="size-20 rounded-full text-sm relative"
          alt="profile_name"
        />
        <i
          data-lucide="camera"
          class="absolute bottom-2 border-4 border-white bg-white rounded-full -right-1"
        >
        </i>
      </div>
      <div class="mx-4">
        <h2 class="text-xl font-medium text-black/80">Profile Photo</h2>
        <p>JPG, PNG or GIF, Max size of 2MD</p>
      </div>
    </div>

    <div class="grid grid-row-1 grid-cols-2 mx-4">
      <div class="block m-2">
        <label for="fullname" class="font-medium">Full Name:</label>
        <input
          id="fullname"
          type="text"
          name="username"
          value="{{ request.user.name }}"
          required
          class="block my-2 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
        />
      </div>

      <div class="block m-2">
        <label for="email" class="font-medium">Email Address:</label>
        <input
          id="email"
          type="email"
          name="email"
          value="{{ request.user.email }}"
          required
          class="block my-2 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
        />
      </div>

      <div class="block m-2">
        <label for="phone-number" class="font-medium text-black/80"
          >Phone Number:</label
        >
        <input
          id="phone-number"
          type="text"
          name="phone_number"
          value="{{ request.user.phone_number }}"
          required
          class="block my-2 w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
        />
      </div>

      <div class="block m-2">
        <label for="gender " class="font-medium text-black/80">Gender:</label>
        <select
          id="gender"
          name="gender"
          required
          class="col-start-1 my-2 row-start-1 w-full appearance-none rounded-md bg-white/5 py-1.5 pr-8 pl-3 text-base text-black/80 outline-1 -outline-offset-1 outline-gray-200 *:bg-white focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
        >
          {% if request.user.gender == "male"%}
          <option value="male" selected>Male</option>
          <option value="female">Female</option>

          {% else %}
          <option value="male">Male</option>
          <option value="female" selected>Female</option>

          {% endif %}
        </select>
      </div>
    </div>

    <div class="flex items-center my-4 mx-6 justify-end gap-2">
      <button
        type="submit"
        class="bg-blue-500 text-white p-2 font-medium text-sm rounded-md"
      >
        Saves Changes
      </button>
      <a
        href="/customers/delete_account/"
        class="bg-red-500 flex items-center text-white p-2 font-medium text-sm rounded-md"
        ><i data-lucide="trash-2" class="mx-1 size-4"></i> Delete Account</a
      >
    </div>
  </div>
</form>

{% endblock %} {% block scripts %}
<script>
  document
    .getElementById("profile-photo")
    .addEventListener("change", function (e) {
      var fileName = e.target.files.length ? e.target.files[0].name : "";
      document.getElementById("profile-photo-filename").textContent = fileName;
      // keep the label text as "Change photo"
      document.getElementById("profile-photo-label").textContent =
        "Change photo";
    });
</script>
{% endblock %}
