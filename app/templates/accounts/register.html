<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title></title>
  </head>
  <body class="bg-gray-200">
    <!-- register form -->
    <div
      class="md:w-2/5 lg:w-2/5 block bg-white p-6 mx-2.5 md:mx-auto lg:mx-auto mt-15 md:mt-10 lg:mt-5 rounded-md"
    >
      <div class="flex items-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-18M2.25 9l4.5-1.636M18.75 3l-1.5.545m0 6.205 3 1m1.5.5-1.5-.5M6.75 7.364V3h-3v18m3-13.636 10.5-3.819"
          />
        </svg>
        <h2 class="mx-2 text-lg text-base">
          <span class="text-black/40">Home</span
          ><span class="text-blue-500 font-bold mx-0.5">Search</span>
        </h2>
      </div>

      <h3 class="text-3xl mt-7 mb-1.5 font-medium">Create An Account</h3>
      <p class="text-md text-black/50">
        Login account and search for your prefered property.
      </p>

      <form action="/register/" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
        <div class="w-full py-2 p-1 mt-2 mb-1">
          <label for="" class="text-md font-medium text-black/80"
            >Username:</label
          >
          <input
            id="username"
            type="text"
            name="username"
            placeholder="Type in your username"
            required
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
          />
        </div>

        <div class="w-full py-2 p-1 mb-1">
          <label for="" class="text-md font-medium text-black/80">Email:</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="Type in your email"
            required
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
          />
        </div>

        <div class="w-full py-2 p-1 mb-1">
          <label for="" class="text-md font-medium text-black/80"
            >Password:</label
          >
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Type in your password"
            required
            class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
          />
        </div>

        <div class="w-full py-2 p-1 my-3">
            <label for="gender" class="text-md font-medium text-black/80"
              >Gender:</label
            >
            <select
              id="gender"
              name="gender"
              required
              class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white/5 py-1.5 pr-8 pl-3 text-base text-black/80 outline-1 -outline-offset-1 outline-gray-200 *:bg-white focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
            >
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
          </div>
      
        <div class="block md:flex lg:flex items-center w-full mb-1">
          <div class="w-full py-2 p-1 my-3">
            <label for="" class="text-md font-medium text-black/80"
              >Phone number:</label
            >
            <input
              id="phone-nuumber"
              type="text"
              name="phone-number"
              placeholder="Enter your phone number"
              required
              class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-black/80 outline-1 -outline-offset-1 outline-black/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-black/10 sm:text-sm/6"
            />
          </div>
          <div class="w-full py-2 p-1 my-3">
            <label for="" class="text-md font-medium text-black/80"
              >Account Type:</label
            >
            <select
              id="user_role"
              name="user_role"
              required
              class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white/5 py-1.5 pr-8 pl-3 text-base text-black/80 outline-1 -outline-offset-1 outline-gray-200 *:bg-white focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
            >
            <option>Customer</option>
            <option>Owner</option>
          </select>
          </div>
        </div>
        <hr class="my-3 text-black/10" />

        <button
          class="bg-blue-500 mt-4 hover:bg-blue-400 p-2 block w-full text-white rounded-md text-md"
        >
          Register
        </button>
      </form>
      <p class="text-md text-center text-black/60 my-5">
        Already have an account?
        <a href="/login/" class="text-black/90">login account</a>
      </p>
    </div>
  </body>
</html>
