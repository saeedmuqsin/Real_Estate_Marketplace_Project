<!-- components/inquiry_chat.html -->

<div id="chat-container" class="lg:col-span-7 xl:col-span-8 bg-white border border-slate-200/80 overflow-hidden flex flex-col h-screen">
  <!-- CHAT HEADER -->
  <div class="p-6 border-b border-slate-100 flex items-center justify-between gap-4 sticky top-0 bg-white z-10">
    <div class="flex items-center gap-3">
      <a href="/customers/properties" class="text-slate-400 hover:text-slate-600  cursor-pointer">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div class="hidden lg:flex items-center gap-1.5 text-md font-medium text-slate-600">
        <i data-lucide="message-square" class="size-5 text-slate-400"></i>
        Inquiry Conversation
      </div>
    </div>

  </div>

  <!-- SCROLLABLE CHAT & DETAILS BODY -->
  <div class="flex-1 overflow-y-auto p-6 space-y-6" id="chat-scroll-container">
    
    <!-- CLIENT INFO BANNER -->
    <div class="flex items-start gap-4">
      <img id="chat-client-avatar" class="size-12 rounded-full flex items-center justify-center font-bold text-sm shrink-0" />
      <div>
        <div class="flex items-center gap-2">
          <h2 id="chat-client-name" class="font-bold text-slate-900 text-base">Select an inquiry</h2>
          <span id="chat-status-badge" class="px-2 py-0.5 bg-blue-50 text-blue-600 font-semibold text-[10px] rounded-md capitalize">
            --
          </span>
        </div>
        <p class="text-xs text-slate-400 mt-1 flex flex-wrap items-center gap-x-2">
          <span id="chat-client-email">--</span>
          <span>•</span>
          <span id="chat-client-phone">--</span>
        </p>
        <p id="chat-date" class="text-[11px] text-slate-400 mt-0.5">--</p>
      </div>
    </div>

    <!-- PROPERTY DETAILS -->
    <div>
      <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider mb-2.5">Property of Inquiry</h4>
      <div class="p-3 bg-slate-50/80 border border-slate-100 rounded-2xl flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          
          <img id="chat-prop-img" src="" alt="Property" class="w-16 h-14 object-cover rounded-xl bg-slate-200">
          <div>
            <h3 id="chat-prop-title" class="font-bold text-slate-900 text-sm">--</h3>
            <p id="chat-prop-location" class="text-xs text-slate-400 mt-0.5">--</p>
            <p id="chat-prop-price" class="font-bold text-slate-900 text-xs mt-1">--</p>
          </div>
        </div>
        <a id="chat-prop-view-link" href="#"  class="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors shadow-2xs flex items-center gap-1.5 shrink-0 cursor-pointer">
          View Property
          <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-400"></i>
        </a>
      </div>
    </div>

    <!-- DATE DIVIDER -->
    <div class="relative flex py-2 items-center">
      <div class="flex-grow border-t border-slate-100"></div>
      <span class="flex-shrink mx-4 text-[11px] font-medium text-slate-400">Messages</span>
      <div class="flex-grow border-t border-slate-100"></div>
    </div>

    <!-- CHAT MESSAGES CONTAINER -->
    <div id="messages-list" class="space-y-4">
      <!-- Injected by JS upon selection -->
    </div>

  </div>

  <!-- CHAT INPUT -->
  <div class="p-4 border-t border-slate-100 bg-white">
    <form onsubmit="sendMessage(event)" class="flex items-center gap-2">
      <button type="button" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-xl transition-colors cursor-pointer">
        <i data-lucide="paperclip" class="w-4 h-4"></i>
      </button>
      <input 
        type="text" 
        id="message-input"
        placeholder="Type your reply..." 
        class="flex-1 py-2.5 px-4 bg-slate-50 border border-slate-200/80 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-slate-400"
      >
      <button 
        type="submit" 
        class="px-4 py-2.5 bg-blue-600 text-white font-medium text-xs rounded-xl hover:bg-blue-700 transition-colors flex items-center gap-1.5 shadow-2xs cursor-pointer"
      >
        <span>Send</span>
        <i data-lucide="send" class="w-3.5 h-3.5"></i>
      </button>
    </form>
  </div>

</div>
